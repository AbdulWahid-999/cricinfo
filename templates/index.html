<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Scores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            margin: 20px;
            background-color: whitesmoke; /* Changed body background to whitesmoke */
        }
        .scores-container {
            width: 95%;
            /* max-width: 900px; */
            margin: auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            flex-grow: 1;
            margin-right: auto; /* Align heading to the left */
            font-size: 1.6rem; /* Heading text little bit smaller */
        }
        #search {
            width: 320px; /* Search bar width for medium to large screens */
            height: 30px;
            margin-left: auto; /* Align search bar to the right */
            font-size: medium;
            font-weight: 500;
            padding-left: 4px;
            border: 1px solid black; /* Thick black border */
            border-radius: 5px;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            background-color: azure; /* Changed background to azure */
            border-radius: 8px; /* Slightly rounded corners for the sheet */
            box-shadow: 0 4px 9px rgba(0, 0, 0, 0.4); /* Corrected shadow spread and color to azure */
        }
        li.match {
            padding: 15px;
            border-bottom: 1px solid #ddd; /* Separator line */
        }
        li.match:last-child {
            border-bottom: none; /* No border for the last item */
        }
        li h2 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 5px;
        }
        li p {
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        li.match a {
            text-decoration: none; /* Remove underline */
            color: black; /* Change color to black */
            display: inline-block; /* Required for transform */
            transition: transform 0.3s ease-in-out; /* Smooth transition for hover */
        }
        li.match a::after {
            content: ' →'; /* Add arrow */
            margin-left: 5px;
        }
        li.match a:hover {
            transform: scale(1.05); /* Zoom in on hover */
        }

        @media (max-width: 768px) {
            body {
                margin: 10px;
            }
            .header {
                flex-direction: column;
                align-items: center;
            }
            h1 {
                margin-right: 0;
                margin-bottom: 15px;
                text-align: center;
            }
            #search {
                width: 80%;
                margin-left: 0;
            }
            .scores-container {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Live Cricket Scores</h1>
        <input type="text" id="search" placeholder="Search Here ">
    </div>
    <div class="scores-container">
        <ul>
            {% for entry in entries %}
                <li class="match">
                    <h2>{{ entry.title }}</h2>
                    <p>{{ entry.description }}</p>
                    <a href="{{ entry.link }}" target="_blank">More Info</a>
                </li>
            {% endfor %}
        </ul>
    </div>
    <script>
        document.getElementById('search').addEventListener('keyup', function() {
            let filter = this.value.toUpperCase();
            let matches = document.querySelectorAll('.match');
            matches.forEach(match => {
                let title = match.querySelector('h2').textContent.toUpperCase();
                if (title.indexOf(filter) > -1) {
                    match.style.display = 'block'; /* Changed from flex to block */
                } else {
                    match.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
